<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Supervisi SMKN Pasirian</title>
  <desc id="desc">Platform pengelolaan penilaian kinerja dan supervisi pembelajaran guru.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8ff"/>
      <stop offset="1" stop-color="#e9e6ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5cf2"/>
      <stop offset="1" stop-color="#4f43c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#393276" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="-30" r="260" fill="#dcd8ff" opacity=".65"/>
  <circle cx="1090" cy="570" r="180" fill="#d5f0e4" opacity=".8"/>
  <g filter="url(#shadow)">
    <rect x="78" y="80" width="1044" height="470" rx="34" fill="#fff" stroke="#e7e8f0" stroke-width="2"/>
    <rect x="78" y="80" width="290" height="470" rx="34" fill="#202238"/>
    <rect x="78" y="80" width="290" height="470" rx="34" fill="url(#card)" opacity=".18"/>
  </g>
  <g transform="translate(130 137)">
    <rect width="72" height="72" rx="18" fill="#6d5cf2"/>
    <path d="M18 55V17h9l18 25 18-25h9v38h-9V33L45 54 27 33v22z" fill="#fff"/>
    <circle cx="58" cy="58" r="8" fill="#69c59b" stroke="#6d5cf2" stroke-width="3"/>
  </g>
  <text x="130" y="270" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Supervisi</text>
  <text x="130" y="312" fill="#d8d5ff" font-family="Arial, Helvetica, sans-serif" font-size="22">SMKN Pasirian</text>
  <text x="130" y="430" fill="#cbd0ff" font-family="Arial, Helvetica, sans-serif" font-size="18">Penilaian kinerja guru</text>
  <text x="130" y="462" fill="#cbd0ff" font-family="Arial, Helvetica, sans-serif" font-size="18">dan supervisi pembelajaran</text>
  <g transform="translate(440 145)">
    <text x="0" y="55" fill="#202238" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Kelola supervisi</text>
    <text x="0" y="113" fill="#202238" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">secara bertahap.</text>
    <text x="0" y="175" fill="#7e8198" font-family="Arial, Helvetica, sans-serif" font-size="22">Pra-observasi · Observasi · Pasca-observasi</text>
    <rect y="236" width="570" height="122" rx="20" fill="#f7f7fc" stroke="#e7e8f0" stroke-width="2"/>
    <circle cx="55" cy="297" r="25" fill="#e3f7ed"/>
    <path d="m44 297 8 8 15-17" fill="none" stroke="#2e9c70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="288" fill="#30334a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Ruang refleksi dan kolaborasi</text>
    <text x="100" y="320" fill="#7e8198" font-family="Arial, Helvetica, sans-serif" font-size="17">Dokumentasi penilaian dalam satu tempat</text>
  </g>
